# Redigerbart innhold for Nordic Revisjon. Bilder lagres lokalt i public/media.
media:
  input: public/media
  output: /media
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: site
  label: Nettsted og kontaktinfo
  type: file
  path: src/content/site.json
  format: json
  fields:
  - name: company
    label: Firmanavn
    type: string
  - name: legalName
    label: Juridisk navn
    type: string
  - name: orgNr
    label: Organisasjonsnummer (valgfritt)
    type: string
  - name: email
    label: E-post for kontakt og møtebooking
    type: string
  - name: phone
    label: Telefon (valgfritt)
    type: string
  - name: city
    label: Adresse eller sted (valgfritt)
    type: string
  - name: linkedin
    label: LinkedIn profiladresse (valgfritt)
    type: string
    description: Full https-adresse. La feltet stå tomt til riktig profil er bekreftet.
  - name: nav
    label: Meny
    type: object
    fields:
    - name: tjenester
      label: Tjenester
      type: string
    - name: bransjer
      label: Bransjer
      type: string
    - name: metode
      label: Slik jobber vi
      type: string
    - name: omOss
      label: Om oss
      type: string
    - name: kontakt
      label: Kontakt
      type: string
    - name: cta
      label: Knappetekst
      type: string
- name: hero
  label: Toppseksjon
  type: file
  path: src/content/hero.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: lead
    label: Ingress
    type: text
  - name: ctaPrimary
    label: Primærknapp
    type: string
  - name: ctaSecondary
    label: Sekundærknapp
    type: string
  - name: image
    label: Bilde
    type: image
  - name: imageAlt
    label: Alternativ bildetekst
    type: string
    description: Beskriv motivet kort for personer som ikke kan se bildet.
  - name: caption
    label: Bildetekst
    type: string
- name: intro
  label: Verdier under toppseksjonen
  type: file
  path: src/content/intro.json
  format: json
  fields:
  - name: items
    label: Elementer
    type: object
    list: true
    fields:
    - name: icon
      label: Ikon
      type: select
      options:
        values:
        - people
        - document
        - shield
        - percent
        - chart
        - mail
        - phone
        - pin
    - name: title
      label: Overskrift
      type: string
    - name: body
      label: Beskrivelse
      type: text
- name: services
  label: Tjenester
  type: file
  path: src/content/services.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: lead
    label: Ingress
    type: text
  - name: linkLabel
    label: Lenketekst
    type: string
  - name: items
    label: Elementer
    type: object
    list: true
    fields:
    - name: title
      label: Overskrift
      type: string
    - name: body
      label: Beskrivelse
      type: text
    - name: detail
      label: Utvidet beskrivelse
      type: text
    - name: image
      label: Bilde
      type: image
    - name: imageAlt
      label: Alternativ bildetekst
      type: string
      description: Beskriv motivet kort for personer som ikke kan se bildet.
  - name: moreLabel
    label: Tekst for utvidelse av tjenestekort
    type: string
- name: about
  label: Om Nordic Revisjon
  type: file
  path: src/content/about.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: paragraphs
    label: Avsnitt
    type: text
    list: true
  - name: cta
    label: Knappetekst
    type: string
  - name: image
    label: Bilde
    type: image
  - name: imageAlt
    label: Alternativ bildetekst
    type: string
    description: Beskriv motivet kort for personer som ikke kan se bildet.
  - name: imageCaption
    label: Tekst over bildet
    type: string
- name: method
  label: Slik jobber vi
  type: file
  path: src/content/method.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: steps
    label: Prosess-steg
    type: object
    list: true
    fields:
    - name: title
      label: Overskrift
      type: string
    - name: body
      label: Beskrivelse
      type: text
- name: industries
  label: Bransjer
  type: file
  path: src/content/industries.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: lead
    label: Ingress
    type: text
  - name: items
    label: Elementer
    type: string
    list: true
  - name: cta
    label: Knappetekst
    type: string
- name: testimonials
  label: Kundehistorier
  type: file
  path: src/content/testimonials.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: lead
    label: Ingress
    type: text
  - name: items
    label: Elementer
    type: object
    list: true
    fields:
    - name: label
      label: Etikett
      type: string
    - name: title
      label: Overskrift
      type: string
    - name: body
      label: Beskrivelse
      type: text
- name: contact
  label: Avsluttende kontaktseksjon
  type: file
  path: src/content/contact.json
  format: json
  fields:
  - name: eyebrow
    label: Liten overskrift
    type: string
  - name: title
    label: Overskrift
    type: string
  - name: lead
    label: Ingress
    type: text
  - name: cta
    label: Knappetekst
    type: string
  - name: emailSubject
    label: Emne for møtehenvendelse
    type: string
  - name: emailBody
    label: Forhåndsutfylt e-post
    type: text
  - name: note
    label: Tekst under knappen
